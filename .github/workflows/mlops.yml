name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Pull data with DVC
        run: |
          dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model (with DagsHub Remote Tracking - Bonus 1)
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_PASS: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          if [ -n "$DAGSHUB_USER" ] && [ -n "$DAGSHUB_PASS" ]; then
            export MLFLOW_TRACKING_URI="https://dagshub.com/${DAGSHUB_USER}/Track2-Day21-K3-01017-NguyenThanhAn.mlflow"
            export MLFLOW_TRACKING_USERNAME="$DAGSHUB_USER"
            export MLFLOW_TRACKING_PASSWORD="$DAGSHUB_PASS"
            echo "Connected to remote MLflow Tracking Server on DagsHub: $MLFLOW_TRACKING_URI"
          fi
          python src/train.py


      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; print(json.load(open('outputs/metrics.json'))['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print(f"Uploaded model.pkl to gs://{bucket_name}/models/latest/model.pkl")

          blob_metrics = bucket.blob("models/latest/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print(f"Uploaded metrics.json to gs://{bucket_name}/models/latest/metrics.json")
          EOF

      - name: Save metrics and reports as artifacts (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt

  # JOB 3: Kiểm tra chất lượng & Chặn suy thoái mô hình (Bonus 4)
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install google-cloud-storage

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Check eval gate & Model regression guard (Bonus 4)
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os, sys, json
          from google.cloud import storage

          acc = float(os.environ["ACCURACY"])
          threshold = float(os.getenv("EVAL_THRESHOLD", "0.60"))
          print(f"--- [Job Eval] Kiem tra chat luong mo hinh ---")
          print(f"  Accuracy hien tai: {acc:.4f} (Nguong toi thieu: {threshold})")

          if acc < threshold:
              print(f"  ❌ Model accuracy {acc:.4f} is below threshold {threshold}. Failing pipeline.")
              sys.exit(1)

          # BONUS 4: So sanh voi mo hinh dang chay tren cloud (Model Regression Guard)
          try:
              bucket_name = os.environ["CLOUD_BUCKET"]
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("models/latest/metrics.json")
              if blob.exists():
                  prev_data = json.loads(blob.download_as_text())
                  prev_acc = float(prev_data.get("accuracy", 0.0))
                  print(f"  [Bonus 4] Accuracy mo hinh cu tren Cloud: {prev_acc:.4f}")
                  if acc < prev_acc:
                      print(f"  ⚠️ Canh bao: Accuracy moi ({acc:.4f}) thap hon phien ban cu ({prev_acc:.4f})!")
                  else:
                      print(f"  ✅ Accuracy moi ({acc:.4f}) >= phien ban cu ({prev_acc:.4f}). Dat tieu chuan nang cap!")
              else:
                  print("  [Bonus 4] Day la lan deploy dau tien, chua co metrics phien ban cu.")
          except Exception as e:
              print(f"  [Bonus 4 Info] Khong the tai metrics cu: {e}")

          print("Eval gate passed successfully!")
          EOF


  # JOB 4: Triển khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/src
            if [ ! -f /etc/systemd/system/mlops-serve.service ]; then
              sudo tee /etc/systemd/system/mlops-serve.service > /dev/null <<'EOF'
            [Unit]
            Description=MLOps Model Inference Server
            After=network.target

            [Service]
            User=ubuntu
            WorkingDirectory=/home/ubuntu
            Environment="GCS_BUCKET=${{ secrets.CLOUD_BUCKET }}"
            ExecStart=/usr/bin/python3 /home/ubuntu/src/serve.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF
              sudo systemctl daemon-reload
              sudo systemctl enable mlops-serve
            fi
            sudo systemctl restart mlops-serve
            sleep 5
            for i in $(seq 1 10); do
              if curl -s -f http://localhost:8000/health; then
                echo "Health check passed!"
                exit 0
              fi
              echo "Waiting for service to become healthy... retry $i"
              sleep 3
            done
            exit 1

